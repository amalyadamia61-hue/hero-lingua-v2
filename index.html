<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO LINGUA V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07152f;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;background:#104b9a;color:white;border:2px solid #7be6ff;border-radius:12px;padding:9px 13px;font-weight:700}button:focus-visible,input:focus-visible{outline:4px solid #ffdf57}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1280px;margin:auto}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#173458 center/100% 100% no-repeat;overflow:hidden}.overlay{position:absolute;z-index:2}.hud{top:1%;left:16%;width:68%;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:#061b43e8;border-radius:14px;padding:7px;font-weight:bold;font-size:clamp(10px,1.3vw,17px)}.prompt{top:15%;left:20%;width:60%;background:#061b43eb;border:2px solid #83eaff;border-radius:16px;text-align:center;padding:12px;font-size:clamp(14px,2vw,25px);font-weight:bold}.answers{top:43%;left:16%;width:68%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.answers button{font-size:clamp(12px,1.4vw,20px);background:#114991e8;min-width:28%;min-height:50px}.answers button[aria-pressed=true]{outline:4px solid #ffdc57}.feedback{top:83%;left:19%;width:62%;background:#081c40ed;border-radius:12px;text-align:center;font-weight:bold;padding:8px}.zone{position:absolute;top:55%;width:33%;height:24%;background:#0726537a;border:3px dashed #b4f4ff;border-radius:15px;font-size:clamp(12px,1.7vw,23px);z-index:2}.zone.left{left:11%}.zone.right{right:11%;border-color:#ffb3c1;background:#5e152b88}.zone:focus-visible,.zone.over{outline:5px solid #ffe36b}.wordcard{top:37%;left:38%;width:24%;text-align:center;cursor:grab;touch-action:none;background:#fff5d9;color:#15284b;border:3px solid #ffd65d;border-radius:15px;padding:14px;font-weight:bold;font-size:clamp(15px,2.5vw,30px)}.avatar{position:absolute;left:1%;bottom:9%;height:35%;max-width:15%;object-fit:contain;pointer-events:none;z-index:1}.hot{position:absolute;background:transparent;border:2px solid transparent;color:transparent;z-index:3}.hot:focus-visible,.hot:hover{background:#123f82aa;border-color:#ffe45a;color:#fff}.panel{max-width:1000px;margin:12px auto;padding:16px;background:#081e46;border:2px solid #56d9ff;border-radius:16px}.controls,.flex{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}.controls{padding:12px}.muted{color:#d6e8ff}.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input{padding:10px;border-radius:8px;max-width:100%}.choice-heroes{display:flex;gap:10px;flex-wrap:wrap}.hero{width:125px;display:flex;flex-direction:column;align-items:center;gap:4px}.hero img{height:90px;max-width:95px;object-fit:contain}.hero[aria-pressed=true]{border-color:#ffe45a;background:#225f92}.notice{background:#102f5c;padding:8px;border-radius:8px}.note-nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.sr{position:absolute;left:-9999px}@media(max-width:700px){.stage{aspect-ratio:4/3}.hud{left:5%;width:90%}.prompt{left:8%;width:84%;top:16%}.answers{left:8%;width:84%;top:45%}.answers button{min-width:42%;padding:5px}.zone{top:57%;height:23%;width:40%}.zone.left{left:6%}.zone.right{right:6%}.wordcard{left:30%;width:40%;top:39%;padding:8px}.avatar{height:24%}.feedback{top:84%;left:8%;width:84%}}
@media print{body *{visibility:hidden!important}#certificate,#certificate *{visibility:visible!important}#certificate{position:absolute!important;inset:0!important;display:block!important;background:white!important;color:#132e5d!important;border:16px double #174b8d!important;padding:9% 7%!important;text-align:center!important;width:100%!important;min-height:95vh!important}#certificate h1{font-size:36pt}#certificate h2{font-size:29pt}@page{size:A4 landscape;margin:0}}
</style></head><body><main class="wrap">
<div id="stage" class="stage" aria-label="Ruang permainan HERO LINGUA"></div>
<div id="panel" class="panel"></div>
<nav class="controls" aria-label="Navigasi"><button id="home">🏠 Utama</button><button id="map">🗺️ Peta</button><button id="notes">📖 Nota</button><button id="speak">🔊 Dengar arahan</button><button id="music">🎵 Muzik: Mati</button><button id="camera">📷 Kamera pilihan</button></nav>
<div id="cameraBox" class="panel" hidden><video id="video" autoplay playsinline muted style="width:200px;max-width:100%;transform:scaleX(-1)"></video><button id="closeCamera">Tutup kamera</button><p>Kamera ialah pilihan. Kawalan tetikus, sentuhan dan papan kekunci tetap tersedia. Gerakan tangan MediaPipe belum diaktifkan dalam versi ini.</p></div>
<div id="certificate" hidden></div><audio id="theme" src="assets/hero-theme.mp3" loop preload="none"></audio>
</main><script>
'use strict';
const A='assets/',stage=document.querySelector('#stage'),panel=document.querySelector('#panel'),theme=document.querySelector('#theme');
const noteFiles=['nota-utama.png','nota-am.png','nota-khas.png','contoh-ayat-1.png','contoh-ayat-2.png','latihan-nota.png','penutup-nota.png'];
const noteText=['Pengenalan kata nama am dan kata nama khas.','Kata nama am ialah nama umum bagi orang, tempat, benda dan haiwan.','Kata nama khas ialah nama khusus bagi orang, tempat, benda dan haiwan. Huruf awalnya ditulis dengan huruf besar.','Ali membaca buku di sekolah.','Siti melawat Kuala Lumpur bersama keluarga.','Mari kita uji pengetahuan tentang kata nama.','Syabas! Kamu sudah bersedia untuk menyertai misi.'];
const heroes=[['Captain Sentinel','captain-sentinel.png'],['Iron Avenger','iron-avenger.png'],['Scarlet Sorceress','scarlet-sorceress.png'],['Thunder Maiden','thunder-maiden.png']];
const banks=[
[{word:'kucing',correct:0},{word:'Malaysia',correct:1},{word:'sekolah',correct:0},{word:'Ali',correct:1},{word:'kereta',correct:0}],
[{ask:'Pilih SEMUA kata nama am.',options:['pokok','Siti','beg','sekolah'],correct:[0,2,3],multi:true},{ask:'Pilih SEMUA kata nama khas.',options:['Ali','Malaysia','kucing','Siti'],correct:[0,1,3],multi:true},{ask:'Pilih SEMUA kata nama am.',options:['bola','Kuala Lumpur','taman','kereta'],correct:[0,2,3],multi:true}],
[{ask:'Lengkapkan ayat: “_____ membaca buku di perpustakaan.”',options:['Ali','kereta','kucing'],correct:0},{ask:'Lengkapkan ayat: “Kami melawat _____.”',options:['bola','Menara Berkembar PETRONAS','pokok'],correct:1},{ask:'Pilih ayat yang menggunakan kata nama khas dengan betul.',options:['siti bermain di taman.','Siti bermain di taman.','SITI bermain di taman.'],correct:1}],
[{ask:'Pilih ayat yang betul.',options:['Ali bermain bola di taman.','ali bermain bola di taman.','Ali bermain Bola di Taman.'],correct:0},{ask:'Pilih ayat yang betul.',options:['Kami pergi ke malaysia.','Kami pergi ke Malaysia.','kami pergi ke Malaysia.'],correct:1},{ask:'Pilih ayat yang betul.',options:['Siti menjaga kucing bernama Si Comel.','siti menjaga kucing bernama si comel.','Siti menjaga Kucing bernama si comel.'],correct:0}]];
let page='home',note=0,mission=0,q=0,score=0,lives=3,time=60,timer=null,advance=null,finished=[false,false,false,false],player='',klass='',hero=1,selected=[],voice=true,stream=null,musicOn=false,questionLocked=false,remaining=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bg(f){stage.style.backgroundImage=`url("${A+f}")`;stage.replaceChildren()}
function elem(tag,cls,html,parent=stage){let x=document.createElement(tag);if(cls)x.className=cls;if(html!==undefined)x.innerHTML=html;parent.append(x);return x}
function hot(label,x,y,w,h,fn){let b=elem('button','hot',esc(label));b.setAttribute('aria-label',label);Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.onclick=fn;return b}
function clear(){clearInterval(timer);clearTimeout(advance);timer=null;advance=null}
function say(t){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.9;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ms'));if(v)u.voice=v;let original=theme.volume;theme.volume=musicOn?.10:original;u.onend=()=>{theme.volume=musicOn?.28:original};u.onerror=()=>{theme.volume=musicOn?.28:original};speechSynthesis.speak(u)}
function startMusic(){if(!musicOn){musicOn=true;theme.volume=.28;theme.play().catch(()=>{musicOn=false;musicBtn()});musicBtn()}}
function musicBtn(){document.querySelector('#music').textContent='🎵 Muzik: '+(musicOn?'Hidup':'Mati')}
function view(p){clear();page=p;render()}
function render(){if(page==='home')home();else if(page==='map')map();else if(page==='note')showNote();else if(page==='mission')showQuestion();else if(page==='result')result();else if(page==='final')finalPage()}
function save(){player=document.querySelector('#name')?.value.trim()||player;klass=document.querySelector('#class')?.value.trim()||klass}
function home(){bg('halaman-utama.png');hot('Buka nota',2,70,23,22,()=>{save();note=0;view('note')});hot('Mula pengembaraan',41,83,27,15,()=>{save();startMusic();view('map')});panel.innerHTML=`<h2>🦸 Selamat datang ke HERO LINGUA V2!</h2><div class="formrow"><label>Nama penuh <input id="name" maxlength="70" value="${esc(player)}" placeholder="Nama penuh"></label><label>Kelas <input id="class" maxlength="35" value="${esc(klass)}" placeholder="Contoh: 3 Bestari"></label></div><p>Pilih karakter wira kamu:</p><div class="choice-heroes">${heroes.map((h,i)=>`<button class="hero" data-h="${i}" aria-pressed="${hero===i}"><img src="${A+h[1]}" alt=""><span>${h[0]}</span></button>`).join('')}</div><p class="muted">Nota, peta dan misi boleh dibuka menggunakan tetikus, sentuhan atau papan kekunci.</p><button id="go">▶ Mula Pengembaraan</button>`;panel.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hero=+b.dataset.h;panel.querySelectorAll('[data-h]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('#go').onclick=()=>{save();startMusic();view('map')}}
function map(){bg('peta-misi.png');[[9,40],[32,40],[56,40],[79,40]].forEach(([x,y],i)=>hot('Misi '+(i+1),x,y,20,37,()=>start(i)));panel.innerHTML=`<h2>🗺️ Peta Misi Kota Lingua</h2><div class="flex">${banks.map((_,i)=>`<button data-m="${i}">Misi ${i+1} ${finished[i]?'💎':'⭐'}</button>`).join('')}</div><p>Kristal diperoleh: ${finished.filter(Boolean).length}/4</p>${finished.every(Boolean)?'<button id="ending">🏆 Jana Sijil</button>':''}`;panel.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(+b.dataset.m));if(document.querySelector('#ending'))document.querySelector('#ending').onclick=()=>view('final')}
function showNote(){bg(noteFiles[note]);hot('Sebelumnya',69,88,13,11,()=>{note=Math.max(0,note-1);showNote()});hot('Seterusnya',83,88,16,11,()=>{if(note===6)start(0);else{note++;showNote()}});panel.innerHTML=`<h2>📖 Nota ${note+1}/7</h2><p>${noteText[note]}</p><div class="note-nav"><button id="prev" ${note===0?'disabled':''}>⬅ Sebelumnya</button><button id="read">🔊 Dengar semula</button><button id="next">${note===6?'Mula Misi 1':'Seterusnya ➡'}</button></div>${note===5?'<p>Latihan interaktif: Pilih jenis kata nama bagi perkataan <b>Malaysia</b>.</p><div class="flex"><button data-practice="0">Kata Nama Am</button><button data-practice="1">Kata Nama Khas</button></div><p id="practiceResult" role="status"></p>':''}`;document.querySelector('#prev').onclick=()=>{note--;showNote()};document.querySelector('#next').onclick=()=>note===6?start(0):(note++,showNote());document.querySelector('#read').onclick=()=>say(noteText[note]);panel.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{document.querySelector('#practiceResult').textContent=+b.dataset.practice===1?'✅ Syabas! Malaysia ialah kata nama khas.':'❌ Cuba lagi. Malaysia ialah nama khusus sebuah negara.'})}
function start(i){clear();mission=i;q=0;score=0;lives=3;time=60;selected=[];questionLocked=false;page='mission';showQuestion();timer=setInterval(()=>{if(page!=='mission')return;time=Math.max(0,time-1);let e=document.querySelector('#clock');if(e)e.textContent=time;if(time===0){clear();view('result')}},1000);say('Misi '+(i+1)+'. '+(i===0?'Seret atau pilih kad perkataan, kemudian tentukan jenis kata nama.':banks[i][0].ask))}
function status(){return `<span>⭐ Misi ${mission+1}</span><span>⏱ <span id="clock">${time}</span> saat</span><span>❤️ ${lives} nyawa</span><span>Skor ${score}</span><span>Soalan ${q+1}/${banks[mission].length}</span>`}
function showQuestion(){let bank=banks[mission],item=bank[q];if(!item){finished[mission]=true;view('result');return}questionLocked=false;bg('bg-misi'+(mission+1)+'.png');elem('div','overlay hud',status());let img=elem('img','avatar');img.src=A+['iron-avenger.png','captain-sentinel.png','scarlet-sorceress.png','thunder-maiden.png'][mission];img.alt='';
if(mission===0){elem('div','overlay prompt','Seret atau pilih kad perkataan');let card=elem('button','overlay wordcard',esc(item.word));card.draggable=true;card.setAttribute('aria-label','Kad '+item.word+'. Pilih kategori di bawah.');card.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','card'));['Kata Nama Am','Kata Nama Khas'].forEach((name,i)=>{let zone=elem('button','zone '+(i===0?'left':'right'),name);zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');answer(i===item.correct)});zone.onclick=()=>answer(i===item.correct)});let touchStart=null;card.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId)});card.addEventListener('pointerup',e=>{if(!touchStart)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');if(target)answer((target.classList.contains('left')?0:1)===item.correct);touchStart=null});panel.innerHTML='<p class="muted">Seret kad ke platform biru atau merah. Alternatif inklusif: klik platform pilihan atau gunakan Tab dan Enter.</p><button id="repeat">🔊 Ulang arahan</button>';document.querySelector('#repeat').onclick=()=>say('Kelaskan perkataan '+item.word+'. Pilih kata nama am atau kata nama khas.')}
else{elem('div','overlay prompt',esc(item.ask));let answers=elem('div','overlay answers');item.options.forEach((option,i)=>{let b=elem('button','',esc(option),answers);b.dataset.i=i;b.setAttribute('aria-pressed','false');b.onclick=()=>{if(item.multi){selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];b.setAttribute('aria-pressed',String(selected.includes(i)))}else answer(i===item.correct)}});panel.innerHTML=`<div class="flex">${item.multi?'<button id="check">✔ Semak jawapan</button>':''}<button id="repeat">🔊 Ulang arahan</button></div><p class="muted">${item.multi?'Pilih semua jawapan yang betul, kemudian tekan Semak.':'Pilih satu jawapan.'}</p>`;if(item.multi)document.querySelector('#check').onclick=()=>answer(selected.length===item.correct.length&&selected.every(x=>item.correct.includes(x)));document.querySelector('#repeat').onclick=()=>say(item.ask)}
elem('div','overlay feedback','Pilih jawapan kamu.').id='feedback';selected=[]}
function answer(ok){if(questionLocked)return;questionLocked=true;stage.querySelectorAll('button').forEach(b=>b.disabled=true);let msg=ok?'✅ Syabas! Jawapan kamu betul.':'❌ Belum tepat. Cuba lagi pada soalan seterusnya.';if(ok)score+=20;else lives--;document.querySelector('#feedback').textContent=msg;say(msg);advance=setTimeout(()=>{if(page!=='mission')return;q++;if(lives<=0)view('result');else showQuestion()},1500)}
function result(){bg('bg-penutup.png');let win=q>=banks[mission].length&&lives>0;panel.innerHTML=`<h2>${win?'🎉 Misi berjaya!':'🌟 Teruskan usaha!'}</h2><p>Skor: ${score} | ${win?'Kristal Bahasa diperoleh!':'Cuba lagi untuk memperoleh kristal.'}</p><div class="flex"><button id="retry">Main Semula</button><button id="back">Peta Misi</button>${win&&mission<3?'<button id="nextMission">Misi Seterusnya</button>':''}${finished.every(Boolean)?'<button id="finish">Jana Sijil</button>':''}</div>`;document.querySelector('#retry').onclick=()=>start(mission);document.querySelector('#back').onclick=()=>view('map');if(document.querySelector('#nextMission'))document.querySelector('#nextMission').onclick=()=>start(mission+1);if(document.querySelector('#finish'))document.querySelector('#finish').onclick=()=>view('final')}
function finalPage(){bg('pusat-kristal.png');panel.innerHTML=`<h2>🏆 Tahniah! Kamu berjaya menamatkan semua misi Kota Lingua.</h2><p>Empat Kristal Bahasa berjaya dikumpulkan.</p><label>Nama penuh pada sijil <input id="certName" maxlength="70" value="${esc(player)}"></label> <label>Kelas <input id="certClass" maxlength="35" value="${esc(klass)}"></label><div class="flex"><button id="preview">Pratonton Sijil</button><button id="pdf">🖨 Jana Sijil PDF</button><button id="replay">Main Semula</button></div><p class="muted">Pada tetingkap cetakan, pilih “Save as PDF” atau “Simpan sebagai PDF”.</p>`;document.querySelector('#preview').onclick=()=>{makeCertificate();document.querySelector('#certificate').hidden=false;document.querySelector('#certificate').scrollIntoView()};document.querySelector('#pdf').onclick=()=>{makeCertificate();window.print()};document.querySelector('#replay').onclick=()=>{finished=[false,false,false,false];document.querySelector('#certificate').hidden=true;view('home')}}
function makeCertificate(){let n=document.querySelector('#certName').value.trim(),k=document.querySelector('#certClass').value.trim();if(!n){alert('Sila masukkan nama penuh.');return}player=n;klass=k;let c=document.querySelector('#certificate');c.hidden=false;c.style.cssText='background:#fff;color:#173a75;border:14px double #17569d;text-align:center;padding:55px 25px;margin:16px auto;max-width:1100px';c.innerHTML=`<h1>🏆 SIJIL PENCAPAIAN</h1><h2>HERO LINGUA V2</h2><p>Dengan bangganya dianugerahkan kepada</p><h2>${esc(n)}</h2><p>Kelas: ${esc(k||'—')}</p><p>Kerana berjaya menyelesaikan empat misi pembelajaran</p><h3>KATA NAMA AM DAN KATA NAMA KHAS</h3><p>⭐ WIRA BAHASA ⭐</p>`}
document.querySelector('#home').onclick=()=>view('home');document.querySelector('#map').onclick=()=>view('map');document.querySelector('#notes').onclick=()=>{note=0;view('note')};document.querySelector('#speak').onclick=()=>say(page==='mission'?(mission===0?'Kelaskan perkataan '+banks[0][q]?.word:banks[mission][q]?.ask)||'Syabas':page==='note'?noteText[note]:'Selamat datang ke HERO LINGUA V2');document.querySelector('#music').onclick=()=>{if(musicOn){theme.pause();musicOn=false}else{musicOn=true;theme.volume=.28;theme.play().catch(()=>{musicOn=false;alert('Muzik tidak dapat dimainkan. Semak fail assets/hero-theme.mp3.')})}musicBtn()};document.querySelector('#camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.querySelector('#video').srcObject=stream;document.querySelector('#cameraBox').hidden=false}catch(e){alert('Kamera tidak tersedia. Permainan tetap boleh dimainkan tanpa kamera.')}};document.querySelector('#closeCamera').onclick=()=>{stream?.getTracks().forEach(x=>x.stop());stream=null;document.querySelector('#cameraBox').hidden=true};window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(x=>x.stop()));render();
</script></body></html>
