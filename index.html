<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERO LINGUA V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#07142c;color:white;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:2px solid #7ee8ff;background:#063e91;color:white;border-radius:13px;padding:10px 15px;font-weight:bold}button:hover,button:focus-visible{background:#126cd2;outline:3px solid #ffe76c}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1280px;margin:auto}.stage{position:relative;aspect-ratio:16/9;background:#12335a center/100% 100% no-repeat;overflow:hidden}.hot{position:absolute;background:rgba(0,25,70,.14);border:2px solid transparent;color:transparent;overflow:hidden}.hot:hover,.hot:focus-visible{border:3px solid yellow;background:rgba(0,60,130,.5);color:white}.panel{background:#071c43ed;border:2px solid #55dfff;border-radius:18px;padding:18px;margin:12px auto;max-width:960px;box-shadow:0 5px 22px #0008}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px}.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:15px 0}.choice{min-height:70px;font-size:1.1rem}.correct{background:#17653b!important}.wrong{background:#8c2832!important}.muted{color:#d8e8ff}.screen-reader{position:absolute;left:-9999px}.stage-small{max-height:70vh}.status{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}.character{max-height:130px;max-width:100px;object-fit:contain}.notecontent{font-size:1.13rem;line-height:1.6}.camera{max-width:220px;width:100%;border-radius:12px;transform:scaleX(-1)}@media(max-width:650px){.stage{aspect-ratio:16/10}.panel{margin:8px;padding:12px}.hot{font-size:11px}}
</style></head><body><main class="wrap"><div id="visual" class="stage" aria-label="Paparan grafik HERO LINGUA"></div><div id="app" class="panel"></div><div class="controls"><button id="home">🏠 Utama</button><button id="map">🗺️ Peta</button><button id="notes">📖 Nota</button><button id="audio">🔊 Baca arahan</button><button id="music">🎵 Muzik: Mati</button><button id="camera">📷 Kamera pilihan</button></div><div id="camBox" class="panel" hidden><video id="video" class="camera" autoplay muted playsinline></video><button id="stopCam">Tutup kamera</button><p>Kamera adalah pilihan. Semua aktiviti boleh dimainkan tanpa kamera.</p></div></main><script>
const A='assets/';const visual=document.querySelector('#visual'),app=document.querySelector('#app');let page='home',note=0,mission=0,q=0,score=0,lives=3,time=60,timer=null,stream=null,music=false,voice=true,player='',klass='',finished=[false,false,false,false],selected=[];
const noteFiles=['nota-utama.png','nota-am.png','nota-khas.png','contoh-ayat-1.png','contoh-ayat-2.png','latihan-nota.png','penutup-nota.png'];const noteTitles=['Nota Kata Nama','Kata Nama Am','Kata Nama Khas','Contoh Ayat 1','Contoh Ayat 2','Latihan Ringkas','Tahniah'];
const banks=[
[{ask:'Kelaskan perkataan “kucing”.',options:['Kata Nama Am','Kata Nama Khas'],correct:0},{ask:'Kelaskan perkataan “Malaysia”.',options:['Kata Nama Am','Kata Nama Khas'],correct:1},{ask:'Kelaskan perkataan “sekolah”.',options:['Kata Nama Am','Kata Nama Khas'],correct:0},{ask:'Kelaskan perkataan “Ali”.',options:['Kata Nama Am','Kata Nama Khas'],correct:1},{ask:'Kelaskan perkataan “kereta”.',options:['Kata Nama Am','Kata Nama Khas'],correct:0}],
[{ask:'Pilih SEMUA kata nama am.',options:['pokok','Siti','beg','sekolah'],correct:[0,2,3],multi:true},{ask:'Pilih SEMUA kata nama khas.',options:['Ali','Malaysia','kucing','Siti'],correct:[0,1,3],multi:true},{ask:'Pilih SEMUA kata nama am.',options:['bola','Kuala Lumpur','taman','kereta'],correct:[0,2,3],multi:true}],
[{ask:'Lengkapkan ayat: “_____ membaca buku di perpustakaan.”',options:['Ali','kereta','kucing'],correct:0},{ask:'Lengkapkan ayat: “Kami melawat _____.”',options:['bola','Menara Berkembar PETRONAS','pokok'],correct:1},{ask:'Pilih ayat yang menggunakan kata nama khas dengan betul.',options:['siti bermain di taman.','Siti bermain di taman.','SITI bermain di taman.'],correct:1}],
[{ask:'Bina ayat yang betul.',options:['Ali bermain bola di taman.','ali bermain bola di taman.','Ali bermain Bola di Taman.'],correct:0},{ask:'Pilih ayat yang betul.',options:['Kami pergi ke malaysia.','Kami pergi ke Malaysia.','kami pergi ke Malaysia.'],correct:1},{ask:'Pilih ayat yang betul.',options:['Siti menjaga kucing bernama Si Comel.','siti menjaga kucing bernama si comel.','Siti menjaga Kucing bernama si comel.'],correct:0}]];
function bg(file){visual.style.backgroundImage=`url("${A+file}")`;visual.innerHTML=''}function hotspot(label,x,y,w,h,fn){const b=document.createElement('button');b.className='hot';b.textContent=label;b.setAttribute('aria-label',label);Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.onclick=fn;visual.append(b)}function say(s){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ms-MY';u.rate=.88;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ms'));if(v)u.voice=v;speechSynthesis.speak(u)}function clean(){clearInterval(timer);timer=null}function view(p){clean();page=p;render()}function render(){if(page==='home')home();if(page==='map')map();if(page==='note')showNote();if(page==='mission')showQuestion();if(page==='result')result();if(page==='final')finalPage()}
function home(){bg('halaman-utama.png');hotspot('Buka nota',2,72,24,20,()=>{note=0;view('note')});hotspot('Mula pengembaraan',42,82,26,16,()=>view('map'));hotspot('Misi 1',20,50,18,23,()=>start(0));hotspot('Misi 2',40,49,18,24,()=>start(1));hotspot('Misi 3',60,49,18,24,()=>start(2));hotspot('Misi 4',79,49,19,24,()=>start(3));app.innerHTML=`<h2>🦸 Selamat datang ke HERO LINGUA!</h2><div class="flex"><label>Nama Wira <input id="name" maxlength="70" placeholder="Nama penuh" value="${esc(player)}"></label><label>Kelas <input id="class" maxlength="35" placeholder="Contoh: 3 Bestari" value="${esc(klass)}"></label><button id="save">Simpan</button></div><p class="muted">Pilih Nota untuk belajar atau Mula Pengembaraan untuk bermain. Butang di atas gambar boleh ditekan, termasuk dengan papan kekunci.</p><button id="go">▶️ Mula Pengembaraan</button>`;document.querySelector('#save').onclick=save;document.querySelector('#go').onclick=()=>{save();view('map')}}function save(){player=document.querySelector('#name')?.value.trim()||player;klass=document.querySelector('#class')?.value.trim()||klass}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function map(){bg('peta-misi.png');[[10,43],[32,43],[56,43],[79,43]].forEach(([x,y],i)=>hotspot('Buka Misi '+(i+1),x,y,20,37,()=>start(i)));app.innerHTML=`<h2>🗺️ Peta Misi Kota Lingua</h2><p>Empat misi Bahasa Melayu tanpa keganasan. Setiap misi yang berjaya diselesaikan memberikan satu kristal.</p><div class="choices">${[0,1,2,3].map(i=>`<button data-m="${i}">Misi ${i+1} ${finished[i]?'💎':'✨'}</button>`).join('')}</div><p>Kristal Bahasa: ${finished.filter(Boolean).length} / 4</p>`;app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(+b.dataset.m));if(finished.every(Boolean))app.innerHTML+='<button id="ending">🏆 Pusat Kristal</button>',document.querySelector('#ending').onclick=()=>view('final')}
function showNote(){bg(noteFiles[note]);hotspot('Sebelumnya',70,89,12,10,()=>{note=Math.max(0,note-1);render()});hotspot('Seterusnya',83,89,16,10,()=>{note=Math.min(6,note+1);render()});for(let i=0;i<6;i++)hotspot(noteTitles[i],1,29+i*8,15,8,()=>{note=i;render()});let contents=['Kata nama am ialah nama umum bagi orang, tempat, benda atau haiwan. Kata nama khas ialah nama khusus bagi orang, tempat, benda atau haiwan.','Contoh kata nama am: murid, guru, sekolah, taman, kereta, bola, kucing dan anjing.','Contoh kata nama khas: Ali, Siti, Malaysia, Menara Berkembar PETRONAS dan Si Comel.','Ali membaca buku. Kami pergi ke sekolah. Siti menjaga kucing.','Siti menyiram bunga di taman. Ayah memandu kereta ke Kuala Lumpur.','Cuba bezakan kata nama am dengan kata nama khas sebelum bermain.','Syabas! Kamu bersedia untuk Misi 1.'];app.innerHTML=`<h2>📖 ${noteTitles[note]}</h2><p class="notecontent">${contents[note]}</p><div class="flex"><button id="prev" ${note===0?'disabled':''}>⬅️ Sebelumnya</button><button id="next">${note===6?'Mula Misi 1':'Seterusnya ➡️'}</button><button id="read">🔊 Dengar semula</button></div>`;document.querySelector('#prev').onclick=()=>{note--;render()};document.querySelector('#next').onclick=()=>note===6?start(0):(note++,render());document.querySelector('#read').onclick=()=>say(contents[note])}
function start(i){mission=i;q=0;score=0;lives=3;time=60;selected=[];page='mission';showQuestion();timer=setInterval(()=>{if(page!=='mission')return;time--;let el=document.querySelector('#time');if(el)el.textContent=time;if(time<=0){clean();view('result')}},1000);say('Misi '+(i+1)+'. '+banks[i][0].ask)}function showQuestion(){bg('bg-misi'+(mission+1)+'.png');let b=banks[mission],item=b[q];if(!item){finished[mission]=true;view('result');return}app.innerHTML=`<div class="status"><b>⭐ Misi ${mission+1}</b><b>⏱️ <span id="time">${time}</span> saat</b><b>❤️ ${lives} nyawa</b><b>Skor: ${score}</b><b>Soalan ${q+1}/${b.length}</b></div><h2>${esc(item.ask)}</h2><p>${item.multi?'Pilih semua jawapan yang betul, kemudian tekan Semak.':'Pilih satu jawapan.'}</p><div class="choices">${item.options.map((x,i)=>`<button class="choice" data-i="${i}" aria-pressed="false">${esc(x)}</button>`).join('')}</div><div class="flex">${item.multi?'<button id="check">✔️ Semak jawapan</button>':''}<button id="repeat">🔊 Ulang arahan</button></div><p id="feedback" role="status" aria-live="polite"></p>`;app.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{let i=+btn.dataset.i;if(item.multi){selected.includes(i)?selected=selected.filter(x=>x!==i):selected.push(i);btn.setAttribute('aria-pressed',String(selected.includes(i)));btn.style.outline=selected.includes(i)?'4px solid #ffdf4d':''}else answer(i===item.correct)});if(item.multi)document.querySelector('#check').onclick=()=>answer(selected.length===item.correct.length&&selected.every(i=>item.correct.includes(i)));document.querySelector('#repeat').onclick=()=>say(item.ask)}function answer(ok){let fb=document.querySelector('#feedback');app.querySelectorAll('.choice').forEach(b=>b.disabled=true);let check=document.querySelector('#check');if(check)check.disabled=true;if(ok){score+=20;fb.textContent='✅ Syabas! Jawapan betul.';fb.className='correct';say('Syabas! Jawapan betul.')}else{lives--;fb.textContent='❌ Cuba lagi pada soalan seterusnya. Jawapan yang betul: '+(banks[mission][q].multi?banks[mission][q].correct.map(i=>banks[mission][q].options[i]).join(', '):banks[mission][q].options[banks[mission][q].correct]);fb.className='wrong';say('Belum tepat. Teruskan usaha.')}setTimeout(()=>{if(page!=='mission')return;q++;selected=[];if(lives<=0){view('result')}else showQuestion()},1350)}function result(){bg('bg-penutup.png');const win=q>=banks[mission].length&&lives>0;app.innerHTML=`<h2>${win?'🎉 Misi berjaya!':'🌟 Teruskan usaha!'}</h2><p>Misi ${mission+1} • Skor: ${score} • ${win?'Kristal Bahasa diperoleh!':'Cuba lagi untuk mendapatkan kristal.'}</p><div class="flex"><button id="again">🔄 Main semula</button><button id="backmap">🗺️ Peta Misi</button>${win&&mission<3?'<button id="advance">Misi seterusnya ➡️</button>':''}${finished.every(Boolean)?'<button id="finish">🏆 Tamat Pengembaraan</button>':''}</div>`;document.querySelector('#again').onclick=()=>start(mission);document.querySelector('#backmap').onclick=()=>view('map');if(document.querySelector('#advance'))document.querySelector('#advance').onclick=()=>start(mission+1);if(document.querySelector('#finish'))document.querySelector('#finish').onclick=()=>view('final')}
function finalPage(){bg('pusat-kristal.png');app.innerHTML=`<h2>🏆 Tahniah, anda berjaya habiskan misi Kota Lingua!</h2><p>Syabas ${esc(player||'Wira Bahasa')}! Anda telah memperoleh empat Kristal Bahasa.</p><button id="print">🖨️ Cetak sijil / Simpan PDF</button><button id="replay">Main Semula</button>`;document.querySelector('#print').onclick=()=>{let w=window.open('','_blank');if(!w){alert('Benarkan pop-up untuk mencetak sijil.');return}w.document.write(`<html><head><title>Sijil HERO LINGUA</title><style>body{text-align:center;font-family:Arial;padding:12%;border:16px double #0b63af;min-height:65vh}h1{font-size:45px;color:#09478e}h2{font-size:34px}</style></head><body><h1>SIJIL PENCAPAIAN</h1><h2>HERO LINGUA</h2><p>Dengan bangganya dianugerahkan kepada</p><h2>${esc(player||'Wira Bahasa')}</h2><p>Kelas: ${esc(klass||'—')}</p><p>Kerana berjaya menyelesaikan empat misi Kata Nama Am dan Kata Nama Khas.</p><p>⭐ Wira Bahasa ⭐</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};document.querySelector('#replay').onclick=()=>{finished=[false,false,false,false];view('home')}}
document.querySelector('#home').onclick=()=>view('home');document.querySelector('#map').onclick=()=>view('map');document.querySelector('#notes').onclick=()=>{note=0;view('note')};document.querySelector('#audio').onclick=()=>say(page==='mission'?banks[mission][q]?.ask||'Syabas':page==='note'?noteTitles[note]:'Selamat datang ke HERO LINGUA');document.querySelector('#music').onclick=()=>{music=!music;document.querySelector('#music').textContent='🎵 Muzik: '+(music?'Hidup':'Mati');alert('Tetapan muzik '+(music?'dihidupkan. Tiada fail muzik disertakan.':'dimatikan.'))};document.querySelector('#camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.querySelector('#video').srcObject=stream;document.querySelector('#camBox').hidden=false}catch(e){alert('Kamera tidak tersedia atau kebenaran tidak diberikan. Permainan masih boleh dimainkan menggunakan tetikus, sentuhan atau papan kekunci.')}};document.querySelector('#stopCam').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;document.querySelector('#camBox').hidden=true};window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));render();
</script></body></html>
